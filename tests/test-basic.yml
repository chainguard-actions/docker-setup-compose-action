name: Test basic usage (default version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-compose
        uses: .
        with:
          cache-binary: 'false'
      - name: Assert docker compose is available
        run: |
          echo "Checking docker compose availability..."
          if ! docker compose version; then
            echo "FAIL: docker compose command not available"
            exit 1
          fi
          echo "PASS: docker compose is available"
      - name: Assert compose version output is non-empty
        env:
          VERSION_OUTPUT: ${{ steps.setup-compose.outputs.version }}
        run: |
          echo "version output: $VERSION_OUTPUT"
          if [ -z "$VERSION_OUTPUT" ]; then
            echo "INFO: no version output from action (may be expected)"
          else
            echo "PASS: version output is '$VERSION_OUTPUT'"
          fi
          # Main assertion: docker compose must work
          COMPOSE_VERSION=$(docker compose version --short 2>/dev/null || docker compose version 2>/dev/null)
          echo "compose version: $COMPOSE_VERSION"
          if [ -z "$COMPOSE_VERSION" ]; then
            echo "FAIL: could not get compose version"
            exit 1
          fi
          echo "PASS: docker compose version reported: $COMPOSE_VERSION"
