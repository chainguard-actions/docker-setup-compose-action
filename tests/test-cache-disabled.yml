name: Test with cache disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-compose
        uses: .
        with:
          version: v2.32.4
          cache-binary: 'false'
      - name: Assert docker compose is available even without cache
        run: |
          echo "Checking docker compose availability (cache disabled)..."
          if ! docker compose version; then
            echo "FAIL: docker compose command not available"
            exit 1
          fi
          echo "PASS: docker compose is available"
      - name: Assert correct version is installed
        run: |
          INSTALLED="$(docker compose version 2>&1)"
          echo "installed version: $INSTALLED"
          if echo "$INSTALLED" | grep -qF "2.32.4"; then
            echo "PASS: correct version 2.32.4 is installed"
          else
            echo "FAIL: expected version 2.32.4 but got: $INSTALLED"
            exit 1
          fi
