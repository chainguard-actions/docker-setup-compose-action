name: Test cache disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: 'v2.32.4'
          cache-binary: 'false'
      - name: Assert docker compose is available even without cache
        run: |
          echo "Checking docker compose availability..."
          if ! docker compose version; then
            echo "FAIL: docker compose command not available"
            exit 1
          fi
          echo "PASS: docker compose is available"
      - name: Assert docker compose version is correct
        run: |
          VERSION_OUTPUT=$(docker compose version 2>&1)
          echo "version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -q "2.32.4"; then
            echo "PASS: docker compose version matches 2.32.4"
          else
            echo "FAIL: expected version 2.32.4 but got: $VERSION_OUTPUT"
            exit 1
          fi
