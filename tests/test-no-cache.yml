name: Test installation with cache disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: 'v2.32.4'
          cache-binary: 'false'
      - name: Assert docker compose is available after no-cache install
        run: |
          echo "Checking docker compose availability (no-cache install)..."
          VERSION_OUTPUT=$(docker compose version 2>&1 || true)
          echo "Version output: $VERSION_OUTPUT"
          if ! echo "$VERSION_OUTPUT" | grep -q "2.32.4"; then
            echo "FAIL: expected version 2.32.4 but got: $VERSION_OUTPUT"
            exit 1
          fi
          echo "PASS: docker compose is available with correct version"
